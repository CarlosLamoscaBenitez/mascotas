<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PetCare - Clima</title>
  <style>
    :root { --primary: #4472C4; --bg: #F5F7FA; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); text-align: center; }
    .navbar { display: flex; justify-content: space-between; padding: 1rem 2rem; background: var(--primary); color: white; }
    .container { padding: 3rem; }
    .search-bar { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }
    input { padding: 0.8rem; width: 300px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 0.8rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    #clima-resultado { margin-top: 2rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div>🐾 PetCare Clima</div>
    <a href="index.html" style="color: white; text-decoration: none;">Ir al Inicio</a>
  </nav>

  <div class="container">
    <h2>¿Cómo está el tiempo hoy?</h2>
    <div class="search-bar">
      <input type="text" id="ciudad" placeholder="Ej: Ciudad de México">
      <button onclick="buscarClima()">Consultar</button>
    </div>
    <div id="clima-resultado"></div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
